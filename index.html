<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Character Encoding & Viewport -->
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Primary Meta Tags -->
    <title>SafeMyStuff | Secure Cloud Storage For Your Belongings</title>
    <meta
      name="description"
      content="SafeMyStuff is a secure cloud storage platform to upload, manage and access your files from anywhere. Fast, private and reliable file storage."
    />
    <meta name="keywords" content="cloud storage, secure file storage, file sharing, online storage" />
    <meta name="author" content="SafeMyStuff" />
    <meta name="robots" content="index, follow" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://safemystuff.store/" />

    <!-- Favicon -->
    <link rel="icon" href="/favicon.ico" />

    <!-- Open Graph (Social Sharing) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SafeMyStuff" />
    <meta property="og:url" content="https://safemystuff.store/" />
    <meta property="og:title" content="SafeMyStuff – Secure Cloud Storage" />
    <meta property="og:description" content="Upload, manage and access your files securely from anywhere." />
    <meta property="og:image" content="https://safemystuff.store/og-image.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SafeMyStuff – Secure Cloud Storage" />
    <meta name="twitter:description" content="Upload, manage and access your files securely from anywhere." />
    <meta name="twitter:image" content="https://safemystuff.store/og-image.png" />

    <!-- Theme Color -->
    <meta name="theme-color" content="#0f172a" />

    <!-- Preconnect for Performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@600;700&display=swap"
      rel="stylesheet"
    />

    <!-- App CSS -->
    <link rel="stylesheet" href="./src/App.css" />
  </head>

  <body style="margin: 0; padding: 0; font-family: 'Inter', 'Poppins', sans-serif;">
    <div id="root"></div>

    <!-- Fallback for JavaScript Disabled -->
    <noscript>
      <div style="padding: 2rem; background: #f8f9fa; border: 1px solid #dee2e6; text-align: center; margin: 2rem;">
        <p style="color: #666;">JavaScript is required to view this site. Visit <a href="/">SafeMyStuff</a> for more info.</p>
      </div>
    </noscript>

    <!-- React App Entry Point -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
