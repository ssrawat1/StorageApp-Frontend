<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Primary (replace text with your brand copy if you prefer) -->
    <title>Safemystuff – Secure Cloud Storage</title>
    <meta
      name="description"
      content="Safemystuff is a secure cloud storage platform to upload, manage and access your files from anywhere. Fast, private and reliable file storage for everyone."
    />

    <meta name="author" content="SafeMyStuff" />
    <meta name="robots" content="index, follow" />

    <!-- Canonical (important for SEO) -->
    <link rel="canonical" href="https://safemystuff.store/" />

    <!-- Favicon -->
    <link rel="icon" href="/favicon.ico" />

    <!-- Social preview (Open Graph & Twitter) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SafeMyStuff" />
    <meta property="og:url" content="https://safemystuff.store/" />
    <meta property="og:title" content="SafeMyStuff — Secure Smart Storage" />
    <meta
      property="og:description"
      content="Safemystuff is a secure cloud storage service to upload, store and access your files safely from any device."
    />
    <meta property="og:image" content="https://safemystuff.store/og-image-1200x630.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SafeMyStuff — Secure Smart Storage" />
    <meta
      name="twitter:description"
      content="Safemystuff offers secure cloud storage to upload, organize and access your files anytime, anywhere."
    />
    <meta name="twitter:image" content="https://safemystuff.store/og-image-1200x630.png" />

    <!-- Performance: preconnect for Google fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Load only the weights you need; display=swap helps rendering -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Theme color for mobile -->
    <meta name="theme-color" content="#0f172a" />

    <!-- Minimal structured data to help indexing -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Safemystuff",
        "url": "https://safemystuff.store/",
        "description": "Safemystuff provides secure cloud storage to upload, manage and access your files safely online."
      }
    </script>

    <!-- Your app CSS (keep as-is, just move to production path if different) -->
    <link rel="stylesheet" href="./src/App.css" />
  </head>

  <body style="font-family: Inter, Poppins, sans-serif">
    <div id="root"></div>

    <!-- minimal noscript to help crawlers/users with JS disabled -->
    <noscript>
      <div style="padding: 1rem; background: #fff; border: 1px solid #eee; text-align: center">
        JavaScript is required to view this site. Visit <a href="/">SafeMyStuff</a> for more info.
      </div>
    </noscript>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
