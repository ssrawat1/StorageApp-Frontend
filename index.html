<!doctype html>
<html lang="en">
  <head>
    <!-- Character encoding and browser compatibility -->
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Primary Meta Tags -->
    <title>SafeMyStuff – Secure Cloud Storage</title>
    <meta
      name="description"
      content="SafeMyStuff is a secure cloud storage platform to upload, manage and access your files from anywhere. Fast, private and reliable file storage for everyone."
    />
    <meta name="author" content="SafeMyStuff" />
    <meta name="robots" content="index, follow" />
    <meta name="keywords" content="cloud storage, secure file storage, file sharing, online storage, data backup" />

    <!-- Canonical URL (important for SEO) -->
    <link rel="canonical" href="https://safemystuff.store/" />

    <!-- Favicon -->
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Open Graph Meta Tags (for social sharing) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SafeMyStuff" />
    <meta property="og:url" content="https://safemystuff.store/" />
    <meta property="og:title" content="SafeMyStuff – Secure Cloud Storage" />
    <meta
      property="og:description"
      content="Upload, manage and access your files securely from anywhere. Fast, private and reliable cloud storage for everyone."
    />
    <meta property="og:image" content="https://safemystuff.store/og-image-1200x630.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@safemystuff" />
    <meta name="twitter:title" content="SafeMyStuff – Secure Cloud Storage" />
    <meta
      name="twitter:description"
      content="Upload, manage and access your files securely from anywhere. Fast, private and reliable cloud storage."
    />
    <meta name="twitter:image" content="https://safemystuff.store/og-image-1200x630.png" />

    <!-- Theme color for mobile browsers -->
    <meta name="theme-color" content="#0f172a" />
    <meta name="msapplication-TileColor" content="#0f172a" />

    <!-- Performance: Preconnect to external resources -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://accounts.google.com" />
    <link rel="preconnect" href="https://apis.google.com" />

    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Structured Data (Schema.org - JSON-LD) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "SafeMyStuff",
        "url": "https://safemystuff.store/",
        "description": "Secure cloud storage platform to upload, manage and access your files from anywhere.",
        "publisher": {
          "@type": "Organization",
          "name": "SafeMyStuff",
          "logo": {
            "@type": "ImageObject",
            "url": "https://safemystuff.store/logo.png"
          }
        },
        "sameAs": [
          "https://twitter.com/safemystuff"
        ]
      }
    </script>

    <!-- Google Sign-In -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <!-- Your app CSS -->
    <link rel="stylesheet" href="./src/App.css" />
  </head>

  <body style="font-family: 'Inter', 'Poppins', sans-serif; margin: 0; padding: 0;">
    <div id="root"></div>

    <!-- Fallback for users with JavaScript disabled -->
    <noscript>
      <div style="padding: 2rem; background: #f8f9fa; border: 1px solid #dee2e6; text-align: center; margin: 2rem;">
        <h2 style="color: #333; margin-bottom: 1rem;">JavaScript Required</h2>
        <p style="color: #666; margin-bottom: 1rem;">
          JavaScript is required to view this site. Please enable JavaScript in your browser settings.
        </p>
        <a href="/" style="color: #0066cc; text-decoration: none; font-weight: 600;">Return to SafeMyStuff</a>
      </div>
    </noscript>

    <!-- Your React app entry point -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
